config_version: "1.0.0"
repo:
  url: "https://github.com/MutabilityDetector/MutabilityDetector.git"
  branch: "main"

execution_plan:
  mode: "tests"
  ignore_failures: true
  test_command: "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 mvn -q test"
  granularity: "commits"
  num_commits: 500
  num_runs: 30
  num_repeats: 1
  newest_commit: "2764176d4c40dd3a6d82ed9538be0e113f7976f9"
  randomize_tasks: true
  batch_size: 100
  compile_commands:
    - "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 mvn clean test-compile"
    - "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 mvn -q test"

limits:
  temperature_safe_limit: 65000
  energy_regression_percent: 20

tracked_file_extensions:
  - "java"
  - "xml"
  - "properties"
  - "yaml"
  - "yml"

cpu_thermal_file: "/sys/class/thermal/thermal_zone0/temp"

regression_detection:
  min_commits_before: 0
